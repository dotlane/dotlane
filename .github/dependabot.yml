# Dependency and action updates (docs/security-guide.md). Security updates are on in the
# repository settings; these are the regular version updates. They go into dev with the other
# changes (docs/branching.md), one grouped pull request per ecosystem, so one CI run each.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
