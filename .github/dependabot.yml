# Dependency and action updates (docs/security-guide.md). Security updates are on in the
# repository settings; these are the regular version updates. They go into main through the merge
# queue like any other change (docs/branching.md), one grouped pull request per ecosystem, so one
# CI run each.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
