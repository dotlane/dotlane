name: Feature request
description: Something Dotlane could do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The [roadmap](https://github.com/dotlane/dotlane/blob/main/docs/roadmap.md) lists what is planned (PHP, Linux and Windows, a desktop app); check it first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you would like it to work, from the command line or `dotlane.toml`.
