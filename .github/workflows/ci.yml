name: CI

# Pull requests only, into dev or main (docs/branching.md). No push trigger: a merge reruns what
# its pull request already ran, and release.yml reruns everything on a v* tag before publishing.
on:
  pull_request:
    branches: [dev, main]
    # The default three, plus leaving draft: drafts run nothing until they are ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # release.yml runs the same tests before publishing a release.
  workflow_call:
  # The full suite on any branch, before opening a release pull request:
  # `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

# Least privilege (docs/security-guide.md): CI only reads the repository.
permissions:
  contents: read

# A new push to a branch or pull request cancels that branch's older runs, so stale runs do not
# hold the few macOS runners the plan allows.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Picks the tier (docs/branching.md, CI):
    # - run: the quick Linux tier (test, integration-linux). Every run except a draft pull request.
    # - full: everything else, the macOS, Windows, distro and package jobs (a macOS minute costs ten
    #   Linux minutes on a private repository, Windows two). For a release tag or a manual run,
    #   always; for a pull request into main (a release or a hotfix), when it changes more than
    #   docs; for a pull request into dev, never: the release pull request runs them once for the
    #   whole batch.
    # A skipped job counts as passed for the rulesets' required checks.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      full: ${{ steps.decide.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # a pull request's merge commit and its base
      - id: decide
        env:
          BASE: ${{ github.base_ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          run=true
          if [[ $GITHUB_REF == refs/tags/* || $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            full=true
          elif [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            if [[ $DRAFT == true ]]; then
              run=false full=false
            elif [[ $BASE == main ]]; then
              # The merge commit's first parent is the base branch, so this diff is the pull request.
              code=$(git diff --name-only HEAD^1 HEAD | grep -vE '\.md$|^docs/|^assets/demo/|^\.github/ISSUE_TEMPLATE/' || true)
              if [[ -n $code ]]; then full=true; else full=false; fi
              printf 'Changed outside the docs:\n%s\n' "${code:-(nothing)}"
            else
              full=false
            fi
          else
            full=false
          fi
          echo "Quick tier: $run; full tier: $full"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"

  test:
    # Linux: starts in seconds and costs a tenth of macOS minutes. Everything but the installer
    # builds and tests here; the macOS-only code is still vetted and scanned (GOOS=darwin).
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      # Here rather than in changes: a failed changes job would skip the required checks, and a
      # skipped check counts as passed.
      - name: Only release, hotfix and Dependabot branches go into main
        if: github.base_ref == 'main'
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ ! $HEAD =~ ^(release|hotfix|dependabot)/ ]]; then
            echo "::error::$HEAD targets main. Open it against dev instead (docs/branching.md)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No Actions cache: this account's cache egress allowance ran out (2026-10-30) and
          # restoring then stalled jobs for 15+ minutes; modules download in seconds instead.
          cache: false
      # gofmt, build, vet and govulncheck for Linux and macOS, go test -race, the Bash scripts,
      # the npm tests, goreleaser check: the same script developers run before pushing.
      - run: scripts/check.sh

  install-tests:
    # The installer (launchd, keychain, /etc/resolver, its fakes) is macOS-only code. Intel:
    # GitHub's arm64 Macs kept failing to start this job for lack of capacity (2026-10-30), and
    # these tests use fakes, not the hardware. The integration test stays on arm64.
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30 # counts time queued for a macOS runner too
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No Actions cache: this account's cache egress allowance ran out (2026-10-30) and
          # restoring then stalled jobs for 15+ minutes; modules download in seconds instead.
          cache: false
      - run: go test -race ./internal/install/...
      - name: npm packages end to end (darwin-x64 on this runner)
        run: scripts/npm-e2e.sh

  integration:
    # The real thing on a throwaway Mac: login service, System keychain, /etc/resolver, ports
    # 80/443, with passwordless sudo. See scripts/integration.sh.
    needs: [test, changes]
    if: needs.changes.outputs.full == 'true'
    # Intel, like install-tests: GitHub's arm64 Macs kept failing to start jobs for lack of
    # capacity (2026-10-30). The arm64 build is still produced and checked by release-snapshot.
    # Move back to macos-latest (arm64) once capacity recovers.
    runs-on: macos-15-intel
    # A step waiting on a macOS prompt nobody can answer would otherwise hang for hours; each
    # dotlane call also has its own two-minute limit in the script. The job's limit counts time
    # queued for a macOS runner too, which can be long, hence 30 rather than 15.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No Actions cache: this account's cache egress allowance ran out (2026-10-30) and
          # restoring then stalled jobs for 15+ minutes; modules download in seconds instead.
          cache: false
      - run: scripts/integration.sh

  test-windows:
    # The unit tests on Windows, where the installer's PowerShell builders, the state folder's access
    # control list and the Windows npm launcher get exercised. Without -race: it needs cgo, which
    # the runner's Go setup does not have.
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # see test
      - run: go test ./...
      - run: node --test 'npm/test/*.test.*' # a glob, as in check.sh: Node runs a bare directory as a module

  integration-linux:
    # The real thing on a throwaway Ubuntu: systemd user unit, systemd-resolved, the system CA
    # store and NSS, ports 80/443 through the sysctl, with passwordless sudo. See
    # scripts/integration-linux.sh. Fedora and Arch run the same script in integration-linux-distros.
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # see test
      - name: certutil, so the NSS step (Firefox, Chromium) runs too
        run: sudo apt-get install -y --no-install-recommends libnss3-tools
      - name: Programs resolve through systemd-resolved's stub
        # GitHub's image points /etc/resolv.conf at resolved's upstream list, which bypasses its
        # per-domain routing; dotlane install rightly refuses that. A desktop Ubuntu has the stub
        # already (docs/setup-linux.md, Requirements).
        run: sudo ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
      - run: scripts/integration-linux.sh
      - name: npm packages end to end (linux-x64 on this runner)
        run: scripts/npm-e2e.sh

  integration-linux-distros:
    # integration-linux.sh on Fedora and Arch, each in a privileged container that boots systemd on
    # an Ubuntu runner (scripts/integration-linux-container.sh): GitHub hosts no other distribution.
    # Arch is rolling, so it is pinned twice, to an image digest and to that image's day of the Arch
    # Linux Archive for its packages; a new Arch release cannot break unrelated pull requests. Move
    # both pins together, here and in linux-packages, from
    # `docker buildx imagetools inspect archlinux:latest` (its org.opencontainers.image.version label
    # is the day).
    name: integration-linux (${{ matrix.distro }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:44
          - distro: arch
            image: archlinux@sha256:e82623936fa1a69700b48e98b058df6eaab18b737c27473a7234a40fdecb9413 # 20261025.0.616225
            snapshot: 2026/10/25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # see test
      - run: scripts/integration-linux-container.sh "$IMAGE"
        env:
          IMAGE: ${{ matrix.image }}
          ARCH_SNAPSHOT: ${{ matrix.snapshot }}

  integration-windows:
    # The real thing on a throwaway Windows: scheduled task, NRPT rules, the LocalMachine Root
    # store, DNS on 127.0.0.1:53. The runner is already elevated, so no UAC prompt appears. Run in
    # PowerShell 7 and in Windows PowerShell 5.1, which a fresh Windows still uses by default.
    # See scripts/integration-windows.ps1.
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # see test
      - run: ./scripts/integration-windows.ps1
      - name: npm packages end to end (win32-x64 on this runner)
        if: matrix.shell == 'pwsh'
        shell: bash
        run: scripts/npm-e2e.sh

  release-snapshot:
    # GoReleaser's dry run on every release and hotfix pull request, so .goreleaser.yaml cannot rot between releases.
    # Linux cross-compiles the macOS and Windows binaries (CGO_ENABLED=0) at a tenth of the macOS minutes.
    # Full tier only; not on a release tag (release.yml calls this file as a push), which builds the
    # real thing.
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version comes from git history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No Actions cache: this account's cache egress allowance ran out (2026-10-30) and
          # restoring then stalled jobs for 15+ minutes; modules download in seconds instead.
          cache: false
      - name: Install GoReleaser and Syft
        # Prebuilt releases, each checked against a SHA-256 pinned in the script, instead of
        # third-party actions (docs/security-guide.md, workflow rules).
        run: scripts/install-release-tools.sh "$RUNNER_TEMP/bin"
      - run: goreleaser check
      - name: CHANGELOG.md has an Unreleased section
        run: grep -q '^## \[Unreleased\]' CHANGELOG.md
      - run: goreleaser release --snapshot --clean
      - name: Verify checksums and archives
        working-directory: dist
        run: |
          sha256sum -c checksums.txt
          want="LICENSE NOTICE README.md dotlane"
          for a in dotlane_*.tar.gz; do tar tzf "$a" | LC_ALL=C sort | tr '\n' ' ' | grep -q "^$want $" || { echo "$a: unexpected contents"; exit 1; }; done
          # Windows archives are zips holding dotlane.exe; `unzip -Z1` lists just the names.
          for a in dotlane_*.zip; do unzip -Z1 "$a" | LC_ALL=C sort | tr '\n' ' ' | grep -q "^LICENSE NOTICE README.md dotlane.exe $" || { echo "$a: unexpected contents"; exit 1; }; done
          # Six archives (three OSes, two CPUs) and six Linux packages must exist, and each one is in checksums.txt.
          (( $(printf '%s\n' dotlane_*.tar.gz dotlane_*.zip | wc -l) == 6 )) || { echo "want 6 archives"; ls; exit 1; }
          for ext in deb rpm pkg.tar.zst; do
            (( $(printf '%s\n' dotlane_*.$ext | wc -l) == 2 )) || { echo "want 2 .$ext packages"; ls; exit 1; }
          done
          for f in dotlane_*.tar.gz dotlane_*.zip dotlane_*.deb dotlane_*.rpm dotlane_*.pkg.tar.zst; do grep -qF "  $f" checksums.txt || { echo "$f: not in checksums.txt"; exit 1; }; done
      - name: npm packages from the snapshot binaries
        run: |
          version=$(jq -r .version dist/metadata.json)
          version=${version%%+*} # 0.0.1-snapshot+abc1234: npm versions take no build metadata
          node scripts/npm-build.mjs --version "$version" \
            --darwin-arm64 dist/dotlane_darwin_arm64_v8.0/dotlane \
            --darwin-x64 dist/dotlane_darwin_amd64_v1/dotlane \
            --linux-arm64 dist/dotlane-linux-windows_linux_arm64_v8.0/dotlane \
            --linux-x64 dist/dotlane-linux-windows_linux_amd64_v1/dotlane \
            --win32-arm64 dist/dotlane-linux-windows_windows_arm64_v8.0/dotlane.exe \
            --win32-x64 dist/dotlane-linux-windows_windows_amd64_v1/dotlane.exe \
            --out dist/npm
      - name: npm publish, dry run
        # The release workflow's publish step, minus the upload, so it cannot rot between releases.
        run: scripts/npm-publish.sh dist/npm --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.sbom.json
            dist/checksums.txt
            dist/npm/*.tgz
            dist/homebrew/Casks/dotlane.rb
          retention-days: 7

  linux-packages:
    # The snapshot's Linux packages, the way a user meets them: the .deb on Ubuntu, the .rpm on
    # Fedora and the Arch package on Arch, each installed with the distribution's own package manager
    # in a container that boots systemd. dotlane install then runs from /usr/bin, the end-to-end test
    # runs against it (minus the steps that rebuild the binary), and removing the package must take
    # /usr/bin/dotlane with it (scripts/integration-linux-container.sh, PACKAGE). Pull requests only,
    # like release-snapshot; Arch uses the same two pins as integration-linux-distros.
    name: linux-packages (${{ matrix.distro }})
    needs: release-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:24.04
            package: deb
          - distro: fedora
            image: fedora:44
            package: rpm
          - distro: arch
            image: archlinux@sha256:e82623936fa1a69700b48e98b058df6eaab18b737c27473a7234a40fdecb9413 # 20261025.0.616225
            snapshot: 2026/10/25
            package: pkg.tar.zst
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # see test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot
          path: dist
      - name: Install the package, run the test from /usr/bin, remove the package
        run: |
          packages=(dist/dotlane_*_linux_amd64."$FORMAT")
          (( ${#packages[@]} == 1 )) && [[ -f ${packages[0]} ]] || { echo "want one .$FORMAT for amd64"; ls dist; exit 1; }
          PACKAGE=${packages[0]} scripts/integration-linux-container.sh "$IMAGE"
        env:
          IMAGE: ${{ matrix.image }}
          FORMAT: ${{ matrix.package }}
          ARCH_SNAPSHOT: ${{ matrix.snapshot }}

  homebrew:
    # The snapshot's cask on a throwaway Mac, the way a user meets it: brew install, dotlane
    # install, a site, brew upgrade (the next command restarts the service on the new version),
    # then dotlane uninstall --purge and brew uninstall --zap leave nothing. See
    # scripts/brew-e2e.sh. Pull requests only, like release-snapshot; Intel, like integration.
    needs: [release-snapshot, changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # see integration
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot
          path: dist
      - run: scripts/brew-e2e.sh dist
