name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS first: Phase 1 targets it, and the daemon test binds real ports and sockets.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Bash prototype
        run: bash -n files/bin/dotlane
