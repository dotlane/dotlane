name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege (docs/security-guide.md): CI only reads the repository.
permissions:
  contents: read

jobs:
  test:
    # macOS first: Phase 1 targets it, and the daemon test binds real ports and sockets.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: govulncheck
        # Fails only on vulnerabilities in code Dotlane actually calls.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Bash prototype
        run: bash -n files/bin/dotlane

  integration:
    # The real thing on a throwaway Mac: login service, System keychain, /etc/resolver, ports
    # 80/443, with passwordless sudo. See scripts/integration.sh.
    needs: test
    runs-on: macos-latest
    # A step waiting on a macOS prompt nobody can answer would otherwise hang for hours; each
    # dotlane call also has its own two-minute limit in the script. The job's limit counts time
    # queued for a macOS runner too, which can be long, hence 30 rather than 15.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/integration.sh
