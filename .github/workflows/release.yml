name: Release

# A v* tag builds the macOS archives, checksums and SBOMs with GoReleaser and creates a draft
# GitHub release, after the full test suite (ci.yml) passes. A maintainer reviews the draft and
# publishes it. docs/phase-2.md, P2-M1.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  notes:
    # First and cheap: a version without its own CHANGELOG.md section is not released.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/changelog-section.sh "$GITHUB_REF_NAME"

  tests:
    needs: notes
    uses: ./.github/workflows/ci.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    # Accepts only v* tags (docs/security-guide.md); signing secrets (P2-M2) will live here.
    environment: release
    permissions:
      contents: write # create the release and upload its files
      id-token: write # npm trusted publishing and provenance (only when NPM_PUBLISH is on)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # see ci.yml
      - name: Install GoReleaser and Syft
        run: scripts/install-release-tools.sh "$RUNNER_TEMP/bin"
      - name: Release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - run: goreleaser release --clean --release-notes "$RUNNER_TEMP/notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm packages from the release binaries
        run: |
          node scripts/npm-build.mjs --version "$GITHUB_REF_NAME" \
            --darwin-arm64 dist/dotlane_darwin_arm64_v8.0/dotlane \
            --darwin-x64 dist/dotlane_darwin_amd64_v1/dotlane \
            --out dist/npm
          gh release upload "$GITHUB_REF_NAME" dist/npm/*.tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm
        # Off until the repository is public (provenance needs it) and the three packages have
        # this workflow as their trusted publisher: see docs/releasing.md, npm.
        if: vars.NPM_PUBLISH == 'true'
        run: scripts/npm-publish.sh dist/npm --provenance
