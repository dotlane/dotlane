<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>%TITLE% · Dotlane</title>
<link rel="icon" type="image/svg+xml" href="%FAVICON%">
<style>
:root{--bg:#f8fafc;--card:#ffffff;--line:#e2e8f0;--text:#0f172a;--muted:#475569;--code:#f1f5f9;--dot:#16a34a;--state:%STATE_LIGHT%;
font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#0f172a;--line:#1e293b;--text:#f8fafc;--muted:#94a3b8;--code:#1e293b;--dot:#22c55e;--state:%STATE_DARK%}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;padding:12vh 20px 40px}
main{width:100%;max-width:34rem}
.brand{display:flex;align-items:center;gap:.5rem;color:var(--text);font-weight:600;letter-spacing:-.02em;margin-bottom:2.5rem}
.brand svg{width:2rem;height:1rem}
.bar{display:flex;align-items:center;gap:.75rem;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.6rem .6rem .6rem 1.1rem;margin-bottom:1.75rem}
.bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 .95rem ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bar i{width:.85rem;height:.85rem;border-radius:50%;background:var(--state);flex:none}
.status{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 .4rem}
h1{font-size:1.6rem;line-height:1.25;letter-spacing:-.02em;margin:0 0 .75rem}
p{margin:0 0 1rem;color:var(--muted)}
pre{background:var(--code);border-radius:.6rem;padding:.8rem 1rem;margin:0 0 1rem;overflow-x:auto;font:.9rem/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text)}
code{font:.9em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text)}
footer{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<main>
<div class="brand"><svg viewBox="8 20 48 24" aria-hidden="true"><rect x="11.5" y="23.5" width="41" height="17" rx="8.5" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="43.5" cy="32" r="3.75" fill="var(--dot)"/></svg>dotlane</div>
<div class="bar"><span>https://{http.request.tls.server_name}</span><i aria-hidden="true"></i></div>
%BODY%
<footer>This page comes from Dotlane, which serves this address on your Mac, not from your app.</footer>
</main>
</body>
</html>
