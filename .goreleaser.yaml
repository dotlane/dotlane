# Release builds (docs/history/phase-2.md, P2-M1). Checked on every pull request with a snapshot build
# (.github/workflows/ci.yml) and used by .github/workflows/release.yml on v* tags.
#
#   goreleaser check
#   goreleaser release --snapshot --clean     # local dry run into dist/
#
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: dotlane

before:
  hooks:
    # A release never changes go.mod or go.sum on the way: they must already be tidy.
    - go mod tidy -diff

builds:
  - &build
    id: dotlane
    main: ./cmd/dotlane
    binary: dotlane
    env:
      - CGO_ENABLED=0
    # macOS, Linux and Windows, on both architectures; linux and windows first built in Phase 2
    # (docs/history/phase-2.md) and are released now that install works there (Phase 4). The
    # Windows binary is dotlane.exe: GoReleaser adds the suffix itself.
    #
    # Two builds of the same code, only to keep the Homebrew cask to macOS: a cask takes every
    # archive of the ids it is given, whatever their OS, so the macOS archives need an id of
    # their own (the cask below, and docs/distribution.md).
    goos: [darwin]
    goarch: [arm64, amd64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .CommitDate }}
    # Reproducible: the binary's timestamp is the commit's, not the build machine's clock.
    mod_timestamp: "{{ .CommitTimestamp }}"
  - <<: *build
    id: dotlane-linux-windows
    goos: [linux, windows]

archives:
  - &archive
    id: dotlane
    ids: [dotlane]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
  - <<: *archive
    id: dotlane-linux-windows
    ids: [dotlane-linux-windows]
    # Windows users expect a zip, which Explorer opens without extra tools.
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per archive (tar.gz and zip), made by Syft.
sboms:
  - artifacts: archive

# deb, rpm and Arch Linux packages for Linux, with the binary at /usr/bin/dotlane. They have no
# install scripts on purpose: `dotlane install` is a separate step, run by each user, that asks
# for their password, so a package manager must not run it as root (and `apt remove` cannot undo
# it, as with the Homebrew cask below: run `dotlane uninstall` first). The description and
# homepage are the cask's.
nfpms:
  - id: dotlane
    package_name: dotlane
    ids: [dotlane-linux-windows]
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: https://github.com/dotlane/dotlane
    description: Real, trusted HTTPS addresses for local dev servers
    maintainer: Dotlane <https://github.com/dotlane/dotlane/issues>
    vendor: Dotlane
    license: Apache-2.0
    formats: [deb, rpm, archlinux]
    bindir: /usr/bin

# Release notes come from the version's section of CHANGELOG.md: release.yml passes it with
# --release-notes, which replaces the commit-subject changelog. The changelog step must stay
# enabled: with `disable: true` GoReleaser skips it, ignores --release-notes, and the release
# has no notes (what happened to v0.1.0-rc.1).
changelog:
  use: git

release:
  github:
    owner: dotlane
    name: dotlane
  # A maintainer reviews the draft and publishes it; tags with a suffix (v0.1.0-rc.1) are
  # marked as pre-releases.
  draft: true
  prerelease: auto

# The Homebrew tap, dotlane/homebrew-tap: brew install dotlane/tap/dotlane (docs/homebrew.md,
# P2-M3). GoReleaser only writes the cask, to dist/homebrew/Casks/dotlane.rb; release.yml attaches
# it to the draft, and tap.yml pushes it to the tap when the release is published, not before:
# its URLs point at the release's files, which cannot be downloaded while it is a draft.
homebrew_casks:
  - name: dotlane
    # Only the macOS archives (see builds): the release also holds Linux and Windows ones.
    ids: [dotlane]
    binaries: [dotlane]
    homepage: https://github.com/dotlane/dotlane
    description: Real, trusted HTTPS addresses for local dev servers
    repository:
      owner: dotlane
      name: homebrew-tap
    skip_upload: true
    hooks:
      post:
        # Until the binaries are signed and notarized (P2-M2), macOS would refuse to run a
        # quarantined download. Remove this then.
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/dotlane"]
    # `brew uninstall` cannot undo `dotlane install` (it needs a password), so the caveats say to
    # run `dotlane uninstall` first. After an upgrade, the next command that uses the daemon
    # restarts it on the new version (install.Installer.Upgrade): cask hooks run in a sandbox
    # that cannot.
    caveats: |
      Set Dotlane up once (it explains the two steps that ask for your password):
        dotlane install
      Then serve a dev server at https://myapp.dotlane:
        dotlane add myapp 5173

      After `brew upgrade`, the next dotlane command restarts the service on the new version.

      Before `brew uninstall dotlane`, run `dotlane uninstall` (add --purge to also delete the
      sites and the certificate authority); otherwise the service keeps running.
    zap:
      trash:
        - ~/Library/Application Support/dotlane
        - ~/Library/Logs/dotlane
        - ~/.config/dotlane

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"
