# Development instance: runs next to an installed Dotlane (or the Bash prototype) without
# touching it. Own domain ending, ports, state and login service name.
#   ./bin/dotlane --config dev/config.toml serve       run it in the foreground, or
#   ./bin/dotlane --config dev/config.toml install     run it at login (dev.dotlane.dev)
tld = "dldev"
dns_port = 10054
http_port = 9480    # redirects to https://<name>.dldev:9443
https_port = 9443
state_dir = "state"   # dev/state, ignored by git
service_name = "dev.dotlane.dev"
