<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img" aria-labelledby="t d">
  <title id="t">Dotlane: branches, pull requests, CI and releases</title>
  <desc id="d">Three branches leave main, one per agent, each with a commit per task. Each pull request runs the quick Linux tier when marked ready, then joins the merge queue. The queue tests the group on top of main with the full macOS, Windows and Linux tier; a failing pull request is taken out and the rest are retested. The group lands on main as one squash commit per pull request. A release candidate is a tag on main, and a release pull request collects the changelog fragments before the release tag runs the release workflow.</desc>
