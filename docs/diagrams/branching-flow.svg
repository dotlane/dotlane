    <g class="k18"><rect class="bad" x="770" y="235" width="120" height="30" rx="6"/><text class="m" x="830.0" y="255" text-anchor="middle" style="fill: var(--bad)">PR c failed</text></g>
  </g>
  <g class="k19"><circle class="commit" cx="800" cy="470" r="8"/><circle class="commit" cx="850" cy="470" r="8"/><text class="s" x="825.0" y="500" text-anchor="middle">a and b, squashed</text></g>
  <g class="k20"><circle class="mcommit" cx="920" cy="470" r="8"/><rect class="tag" x="850" y="516" width="140" height="30" rx="6"/><text class="m" x="920" y="536" text-anchor="middle">v0.3.0-rc.1</text></g>
  <g class="k21"><circle class="mcommit" cx="1000" cy="470" r="8"/><text class="s" x="1050" y="452" text-anchor="end">Release v0.3.0</text><rect class="tag" x="950" y="556" width="100" height="30" rx="6"/><text class="m" x="1000" y="576" text-anchor="middle">v0.3.0</text><text class="s" x="936" y="576" text-anchor="end">release.yml publishes</text></g>
  <line x1="40" y1="584" x2="1080" y2="584" stroke="var(--frame)"/>
  <text class="cap tr k22" x="40" y="614">1. Each agent cuts its own branch from origin/main, in its own worktree.</text>
  <text class="cap tr k23" x="40" y="614">2. One commit per task. A user-visible change adds a fragment in changes/, never an edit to CHANGELOG.md.</text>
  <text class="cap tr k24" x="40" y="614">3. Marking the pull request ready runs the quick Linux tier only. Drafts and docs-only changes run nothing.</text>
  <text class="cap tr k25" x="40" y="614">4. gh pr merge --squash --auto puts it in the merge queue. Pull requests never rebase on each other.</text>
  <text class="cap tr k26" x="40" y="614">5. The queue builds the group on top of main and runs the full tier once, for every pull request in it.</text>
  <text class="cap tr k27" x="40" y="614">6. A pull request that breaks the group is taken out; the rest are tested again. Its author fixes it and requeues.</text>
  <text class="cap tr k28" x="40" y="614">7. The group lands as one squash commit per pull request. Main is not tested again: the queue tested that tree.</text>
  <text class="cap tr k29" x="40" y="614">8. A release candidate is a tag on main; its notes come from the changelog fragments.</text>
  <text class="cap tr k30" x="40" y="614">9. A "Release v0.3.0" pull request collects the fragments into CHANGELOG.md. Its tag runs release.yml.</text>
  <text class="cap still" x="40" y="614">Branch from main, open a pull request, merge through the queue; releases are tags on main.</text>
</svg>
