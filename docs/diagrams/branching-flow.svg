  <text class="title" x="40" y="44">Dotlane: branches, pull requests, CI and releases</text>
  <text class="sub" x="40" y="66">Trunk-based on main with a merge queue (docs/branching.md). Purple: branches and pull requests. Green: CI. Amber: tags.</text>
